name: CI

# cang-jie 最小回归网：离线可跑的四类检查（不含真机——设备行为靠工程纪律人工真机验证）。
# 命令与本地 README/PROTOTYPES 一致：uv sync + pytest / pinyin C 差分对拍 / cargo test / 交叉编译冒烟。

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 安全关键 shell 静态检查（install/deploy/fail-safe/packaging 能把设备搞崩，必须零告警）──
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: 全量 .sh 检查（POSIX，揪 busybox 上会炸的 bashism）
        # --severity=warning：只在 warning/error 上门控，容忍 runner apt shellcheck(0.9.x)
        # 与本地(0.11)对 info/style(SC2015/SC2002…)判定的版本漂移。真问题都是 warning+。
        run: git ls-files '*.sh' | xargs -r shellcheck --severity=warning

  # ── host 侧 Python 测试 + 拼音引擎 C↔Python 逐字节差分对拍 ──
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: uv sync（统一 .venv，各线依赖）
        run: uv sync
      # 只跑「自足」测试（fixtures 都进 git）。拼音引擎（pytest + C 差分对拍）**不进 CI**：
      # 它 import/构建时需 ~70MB 有意 gitignore 的 rime-ice 词典源（base/iorest/luna_pinyin.dict.yaml
      # 等），全新 checkout 没有 → 只能在本地 `uv run pytest chinese-ime/pinyin-engine/tests` +
      # `make -C chinese-ime/pinyin-engine/c test diff-check`（有本地词典）跑，见 README。
      - name: pytest（书架 host CLI，自足 fixtures；reading/tests、knowledge/pkm-semantic/proto
          随 2026-09-11 归档已移除，notes/ 纯 Rust 无 host Python 测试）
        run: uv run pytest shelf/host/tests -q
      - name: 网关内嵌 JS 语法检查（ui/app.js 是真文件，编译期 include_str! 进二进制）
        run: node --check gateway/ui/app.js

  # ── 设备端 Rust crate 的 host 测试（rmsvc-core / gateway / shelf / notes，各自独立无根 workspace）──
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test（共享基座 + 网关 + enhance 的两个网页服务，各自独立 crate）
        run: |
          cargo test --manifest-path rmsvc-core/Cargo.toml
          cargo test --manifest-path gateway/Cargo.toml
          cargo test --manifest-path enhance/wallpaper-serve/Cargo.toml
          cargo test --manifest-path enhance/font-serve/Cargo.toml
      - name: cargo test（shelf 内部 workspace：bookconv/book-serve/koreader-serve）
        run: cargo test --manifest-path shelf/Cargo.toml --workspace
      - name: cargo test（notes 内部 workspace：rmv6/notecore/vendorcfg/四服务）
        run: cargo test --manifest-path notes/Cargo.toml --workspace

  # ── aarch64 全静态交叉编译冒烟（打包器分发的设备二进制，别让 musl/链接悄悄坏掉）──
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross
      - name: 装 aarch64 交叉 gcc（编 ring 的 C；musl 链接由 rust-lld 完成）
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: shelf + gateway + notes 交叉编译（shelf/build.sh 顺手编译 ../gateway、../notes，复用仓库 build.sh，与打包器同路径）
        run: sh shelf/build.sh
