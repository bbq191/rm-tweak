[package]
name = "note-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "笔记·本：注册「笔记」tab；条目库 → 设备笔记本（一章一本）投影 + 生成/上传编排（md 导出待建）"

[[bin]]
name = "note-serve"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../../../rmsvc-core" }
notecore = { path = "../../crates/notecore" }
rmv6 = { path = "../../crates/rmv6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "2"

[dev-dependencies]
tempfile = "3"
