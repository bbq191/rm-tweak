[package]
name = "book-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "书架·母版库（入库/优化/落库正交）+ 原生 xochitl 投递"

[[bin]]
name = "book-serve"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../../../rmsvc-core" }
bookconv = { path = "../../crates/bookconv" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
