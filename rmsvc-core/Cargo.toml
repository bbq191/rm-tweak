[package]
name = "rmsvc-core"
version = "0.1.0"
edition = "2021"
description = "reMarkable 设备端 Web 服务共享底座：XDG 路径、服务注册/发现、流式 multipart、资产仓库、HTTP 适配层、xochitl 注入、目录监听。2026-09-11 从 shelf/crates/shelf-core 正名搬顶层——shelf/notes/gateway 三方共用，不是 shelf 私有 crate。"
license = "MIT"

[dependencies]
# tiny_http 0.12.0 的本地副本：只加了"每条连接读空闲超时"一处补丁（上游不设任何超时），见 vendor/tiny_http/src/lib.rs 里 from_listener_with_read_timeout 的注释
tiny_http = { path = "vendor/tiny_http", features = ["ssl-rustls"] }
# 自签证书（首启生成，纯 Rust ring 后端）与密码哈希/Basic 认证
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# 解析已有 CA 证书、判断是否带名称约束（迁移用）。依赖树里本来就有（rcgen/rustls 间接引入），不新增编译量。
x509-parser = { version = "0.18", default-features = false }
sha2 = "0.11"
time = "0.3"
# mDNS 应答器需要 SO_REUSEADDR + 多播接口选择，std UdpSocket 不暴露
socket2 = { version = "0.5", features = ["all"] }
# mDNS 监听内核地址变化（netlink 套接字 + poll），socket2 不管 AF_NETLINK 的地址结构。依赖树里本来就有（socket2/inotify 间接引入）。
libc = "0.2"
base64 = "0.22"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
inotify = { version = "0.11.5", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac", "sha2"] }

[dev-dependencies]
tempfile = "3"
# 测试里用真实的证书链校验器（与 rustls 同一套）证明名称约束生效，并走一次真 TLS 握手验证对端地址
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
rustls-pki-types = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
