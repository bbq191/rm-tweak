[package]
name = "gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "设备端 Web 网关：shelf/notes/enhance 三条线共用的唯一入口（UI + /api/<service>/* 反向代理 + 服务发现）。2026-09-11 从 shelf/services/shelf-gateway 正名搬顶层——它服务三条线，不是 shelf 一个服务。"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
rmsvc-core = { path = "../rmsvc-core" }
serde_json = "1"
ureq = "2"
serde = { version = "1", features = ["derive"] }
# 「设备健康」：statvfs 查 /home 剩余空间（不 fork df）、sha256 算 /usr/bin/xochitl 查固件白名单。两者本来就在依赖树里（rmsvc-core 拉进来的），不新增编译量。
libc = "0.2"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

# 独立顶层 crate，不在任何 workspace 内；profile 跟 shelf/notes 同款：设备端体积优先、全静态 musl。
[profile.release]
opt-level = "z"
lto = true
strip = true
# unwind（不是 abort）：abort 下 catch_unwind 完全无效，一次 panic 会摔掉整个进程（与 shelf 同理，
# 见 shelf/Cargo.toml；2026-09-19《镖人》真机踩过）。网关批量队列 worker 与请求线程里有 `catch_unwind` 兜底的后台线程/批量 worker，
# 失败应该只影响那一项，不该让所有在途操作一起陪葬；代价是二进制体积略增（见提交说明）。
panic = "unwind"
codegen-units = 1
